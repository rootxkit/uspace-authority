name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Every third-party action is pinned to a full commit SHA, the version
# in the comment; dependabot (github-actions) moves the pins by pull
# request. The workflow grants nothing: each job states what it needs
# (contents: read, unless it says more), and no checkout leaves the
# token in .git/config for the steps after it.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=mod
  GOTOOLCHAIN: local

defaults:
  run:
    # Explicit bash runs steps with -eo pipefail. The runner's default,
    # bash -e without pipefail, lets a failing command on the left of a
    # pipe (go test | tee, go tool cover | tail) pass the step.
    shell: bash

jobs:
  # Path filter: Go jobs skip on a docs-only change. A skipped job counts
  # as passed for branch protection, so the required checks never hang.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'api/**'
              - 'schemas/**'
              - 'migrations/**'
              - 'sqlc.yaml'
              - 'internal/store/**/*.sql'
              - 'scripts/**'
              - 'Makefile'
              - '.golangci.yml'
              - 'Dockerfile'
              - 'internal/**/testdata/**'
              - 'deploy/fetch-ground.sh'
              - '.github/workflows/ci.yml'
            # web/ (WP-21) and what it reads from the rest of the
            # repository: the API it generates types from, the frame
            # schemas it generates the extras from, and the lab's
            # console/* examples its tests and smoke run serve.
            web:
              - 'web/**'
              - 'api/openapi.yaml'
              - 'schemas/picture/**'
              - 'schemas/violation/**'
              - 'internal/picture/testdata/lab/**'
              - '.github/workflows/ci.yml'

  build-vet-lint:
    name: build, vet, fmt, lint
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # Pinned to the versions uspace-core pins (and the Makefile's
      # STATICCHECK_VERSION and GOLANGCI_LINT_VERSION).
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0

  test-race:
    name: test with the race detector
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race -shuffle=on
        run: go test -race -count=1 -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  vectors:
    name: knowledge vectors
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # The GeographicLib grids, SHA-256-pinned by deploy/fetch-ground.sh,
      # so terrain_geoid.json's reference cases run instead of skipping
      # (core's from the module cache and internal/ground's through Env).
      # A cache hit is re-verified by the script and downloads nothing.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/geoid
          key: geoid-${{ hashFiles('deploy/fetch-ground.sh') }}
      - name: geoid grids
        run: deploy/fetch-ground.sh --geoid-only "$RUNNER_TEMP/geoid"
      - name: uspace-core vectors at the pinned version, then this repository's
        env:
          USPACE_GEOID_DIR: ${{ runner.temp }}/geoid
        run: |
          set -o pipefail
          { go test -count=1 -run 'Vector|Manifest|Version' -v github.com/rootxkit/uspace-core/... &&
            go test -count=1 -run 'Vector|Manifest|Version' -v ./... ; } 2>&1 | tee vectors.log |
            grep -E '^(--- (FAIL|SKIP)|FAIL|ok)' || { echo "vector tests failed"; exit 1; }

  contract:
    name: contract
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: generated code is up to date with api/openapi.yaml
        run: scripts/verify-generated.sh
      # WP-18: schemas/occurrence/v1.json (owned here, M14): every example
      # validates and is received by the intake, a body that differs by
      # one member is refused, and the file is the contract's request
      # body. The grep fails the step when the tests did not run.
      - name: occurrence/v1 schema and its examples
        run: |
          go test -count=1 -run 'TestOccurrenceSchema' -v ./internal/occurrences/ | tee "$RUNNER_TEMP/occurrence-schema.log"
          grep -- '--- PASS: TestOccurrenceSchemaExamples' "$RUNNER_TEMP/occurrence-schema.log"
          grep -- '--- PASS: TestOccurrenceSchemaMatchesTheContract' "$RUNNER_TEMP/occurrence-schema.log"
      # M11: the CISP's OpenAPI file and schemas in api/clients/ equal the
      # CISP's files at the commit api/clients/SOURCE records, and the
      # check is shown to fail on a changed copy (E-01).
      - name: pinned sibling contracts equal their SOURCE commits
        run: scripts/check-contracts.sh
      - name: a changed copy fails the check
        run: |
          echo '# local change' >> api/clients/cisp.yaml
          if scripts/check-contracts.sh > "$RUNNER_TEMP/contracts.log" 2>&1; then
            cat "$RUNNER_TEMP/contracts.log"; echo "a changed copy passed"; exit 1
          fi
          grep 'differs from' "$RUNNER_TEMP/contracts.log"
          git checkout -- api/clients/cisp.yaml

  integration:
    name: integration
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    # The two databases as service containers; NATS (WP-7 onwards) is
    # started in a step, because JetStream needs the -js flag and a
    # service container cannot be given a command.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: authority
          POSTGRES_PASSWORD: authority
          POSTGRES_DB: authority
        ports: ["56432:5432"]
        options: >-
          --health-cmd "pg_isready -U authority -d authority"
          --health-interval 2s --health-timeout 3s --health-retries 30
      timescaledb:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: authority
          POSTGRES_DB: authority_ts
        ports: ["56433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d authority_ts"
          --health-interval 2s --health-timeout 3s --health-retries 60
    env:
      PG_URL: postgres://authority:authority@localhost:56432/authority?sslmode=disable
      TS_URL: postgres://postgres:authority@localhost:56433/authority_ts?sslmode=disable
      NATS_URL: nats://127.0.0.1:56422
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: NATS with JetStream
        run: |
          docker run -d --name nats -p 127.0.0.1:56422:4222 -p 127.0.0.1:56822:8222 nats:2-alpine -js -m 8222
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:56822/healthz?js-enabled-only=true' >/dev/null; then echo "NATS ready"; exit 0; fi
            sleep 1
          done
          docker logs nats; exit 1
      # D7: the migrate subcommand applies both trees before anything runs.
      - name: migrate both trees
        run: go run ./cmd/uspace-authority migrate
      - name: integration tests
        run: |
          set -o pipefail
          # -p 1: one package at a time. The packages share one NATS, and
          # some tests delete and recreate shared streams (INGEST, TSW,
          # bus.Ensure's topology); another package's api would recreate
          # them underneath (internal/bus/bustest).
          rc=0
          INTEGRATION=1 go test -p 1 -count=1 -run Integration -v ./... 2>&1 | tee integration.log || rc=$?
          passed="$(grep -c '^--- PASS' integration.log || true)"
          failed="$(grep -c '^--- FAIL' integration.log || true)"
          echo "integration: ${passed} top-level tests passed, ${failed} failed"
          if [ "$rc" -ne 0 ]; then echo "integration: go test exited $rc"; exit "$rc"; fi
          if grep -q -- '--- SKIP' integration.log; then echo "an integration test skipped with INTEGRATION=1"; exit 1; fi
          if [ "$passed" -eq 0 ]; then echo "integration: zero tests ran"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-log
          path: integration.log
          if-no-files-found: ignore

  # web/ (WP-21): the console on uspace-ui. Lint (the kit's rules and the
  # restricted imports), types, the generated API and frame types, unit
  # tests, the build and its bundle check, the Playwright smoke against a
  # stub api and a stub picture-ws, and the image build.
  web:
    name: web (lint, types, generated types, tests, build, smoke, image)
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      # Plain output, so the counts copied to the step summary can be read.
      NO_COLOR: "1"
      FORCE_COLOR: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: generated API types are current (uspace-ui-gen-api)
        run: pnpm check:api
      - name: generated frame types are current (json-schema-to-typescript)
        run: pnpm check:schemas
      # E-01: the check fails on a stale file, so a pass above means something.
      - name: a stale generated file fails the check
        run: |
          echo '// stale' >> src/picture/generated/status.d.ts
          if pnpm check:schemas > "$RUNNER_TEMP/schemas.log" 2>&1; then
            cat "$RUNNER_TEMP/schemas.log"; echo "a stale file passed"; exit 1
          fi
          grep 'out of date' "$RUNNER_TEMP/schemas.log"
          git checkout -- src/picture/generated/status.d.ts
      - name: pnpm lint (the kit's config, the restricted imports, the project rules)
        run: pnpm lint
      # The backstop of the lint rule: no forbidden package installed at
      # all, direct or transitive (every package of pnpm-lock.yaml against
      # eslint-rules/restricted.mjs, the rule's own list), and no import of
      # one anywhere in app/ or src/. Both are shown to find their
      # fixtures: a lockfile with transitive forbidden packages, and the
      # lint fixtures that import one.
      - name: no geometry, JWT, database or bus package in web/
        run: |
          set -o pipefail
          node scripts/check-lockfile.mjs pnpm-lock.yaml
          if node scripts/check-lockfile.mjs test/fixtures/forbidden-lock.yaml; then
            echo "the lockfile check passes a lockfile with forbidden transitive packages"; exit 1
          fi
          pattern="from ['\"](@turf/[^'\"]*|turf|h3|h3-js|proj4|jose|pg|nats)['\"]"
          if grep -rnE "$pattern" app src; then echo "a forbidden import in web/"; exit 1; fi
          for f in eslint-rules/fixtures/src/geometry.ts eslint-rules/fixtures/src/jwt.ts; do
            grep -qE "$pattern" "$f" || { echo "the grep does not find the import in $f"; exit 1; }
          done
          echo "no forbidden package or import (and the grep finds the fixtures)"
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: pnpm test (vitest)
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee vitest.log
          { echo '### web: vitest'; echo '```'; grep -E '^ +(Test Files|Tests) ' vitest.log || echo 'counts not found in vitest.log'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/app/**', 'web/src/**', 'web/*.ts', 'web/*.mjs') }}
          restore-keys: next-${{ hashFiles('web/pnpm-lock.yaml') }}-
      - name: pnpm build
        run: pnpm build
      - name: the server bundle names no database, NATS or key variable
        run: |
          set -o pipefail
          pnpm check:bundle | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium and its system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright smoke (next start behind test/mock-origin.mjs)
        run: |
          set -o pipefail
          pnpm e2e 2>&1 | tee playwright.log
          { echo '### web: Playwright'; echo '```'; grep -E '^ +[0-9]+ (passed|failed|skipped|flaky)' playwright.log || echo 'counts not found in playwright.log'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE '^ +[0-9]+ (skipped|flaky)' playwright.log; then echo "playwright: a test skipped or was flaky"; exit 1; fi
          if ! grep -qE '^ +[1-9][0-9]* passed' playwright.log; then echo "playwright: zero tests passed"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results
            web/playwright.log
          if-no-files-found: ignore
      # The image is built here on every change (never on the server); it
      # is pushed and signed by the image job on main and tags.
      - name: web image (Next.js standalone, web/Dockerfile)
        run: docker build -t uspace-authority-web:ci .

  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -show verbose ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The pinned binary (the Makefile's GITLEAKS_VERSION), checked
      # against the SHA-256 written here rather than one fetched beside
      # it, and run with no token (core-ui-ci N13).
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

  # main and v* tags only: build, push to GHCR with an SBOM and
  # provenance, and sign with cosign (keyless).
  image:
    name: image
    if: github.event_name == 'push'
    needs: [build-vet-lint, test-race, vectors, contract, integration, gitleaks, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Installed before the registry login, so no third-party step but
      # the build itself runs beside a live registry credential
      # (core-ui-ci B1).
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
      # The console image's tags (WP-21), also before the login.
      - id: meta-web
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
      # The console image (WP-21), from web/Dockerfile, beside the Go one.
      - id: build-web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: sign the web image
        env:
          DIGEST: ${{ steps.build-web.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}-web@${DIGEST}"
