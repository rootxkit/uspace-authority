# oapi-codegen v2 configuration for api/gen (the output path is passed
# by scripts/generate.sh with -o). Run scripts/generate.sh
# (make generate); never edit api/gen by hand. scripts/verify-generated.sh
# regenerates into a temporary directory and fails on any difference.
package: gen
generate:
  models: true
  std-http-server: true
  strict-server: true
  client: true
  embedded-spec: false
output-options:
  skip-prune: true
  # /metrics is in the contract but served by the Prometheus handler.
  # The x-receiver operations (WP-7) verify an HMAC over the raw body,
  # which a generated handler has already decoded; internal/receivers
  # serves them, and a test holds this list to the contract.
  exclude-operation-ids: [getMetrics, getRIDReceiverConfig, postRIDReceiverHeartbeat, postRIDObservations]
compatibility:
  # Enum constants carry their type name (AuditEventActorTypeClient, not
  # Client), so an enum value never collides with a generated type.
  always-prefix-enum-values: true
