openapi: 3.1.0
info:
  title: uspace-authority national API
  version: 0.1.0
  description: |
    The competent authority's system of the Georgian U-space rebuild.
    This file is the contract: the only source of handlers and types
    (`api/gen/`), and an endpoint that is not in it does not exist
    (spec `00 §7`). Paths are versioned under `/v1`; changes within a
    version are additive only.

    Every error is `application/problem+json` in the shape of the
    `Problem` schema (the lab's `schemas/common/problem/v1`, decision
    M28).

    Every operation carries `security` (an empty list only for the
    health paths) and the vendor extension `x-audit`, which names the
    `events` row the operation writes:

    - `x-audit: none` the operation writes no `events` row (health and
      public reads only);
    - `x-audit: {event_type: <name>, entity_type: <name>, purpose:
      required | optional | none}` the operation writes one `events`
      row of that type, inside the same transaction as its effect;
      `purpose: required` means the request is refused without a
      `purpose` (every PII read, CLAUDE.md rule 6).

    Work packages add their path groups below under a `# WP-k` comment
    and regenerate `api/gen/` with `scripts/generate.sh`.
servers:
  - url: /
tags:
  - name: health
    description: Liveness, readiness and metrics of one process instance (admin port).
  - name: policy
    description: The versioned authority policy (INV-03); thresholds are data.
  - name: audit
    description: The append-only audit log with its monthly hash chain.
  - name: tokens
    description: |
      The ecosystem OAuth2 token service (WP-2): client credentials,
      the JWKS and the issuer metadata. The JWT contract and the scope
      catalogue are the normative tables A and B of
      `docs/WORKPACKAGES/WP-2.md`, restated in
      `docs/runbooks/token-service.md`.
  - name: oauth-admin
    description: The token service's client registry and signing keys (admin).
  - name: auth
    description: Console sign-in, TOTP and sessions (WP-2).
  - name: users
    description: Console accounts (admin).

paths:
  # WP-0: health paths, served by every process on its admin port.
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness
      description: 200 while the process runs. Says nothing about dependencies.
      security: []
      x-audit: none
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness
      description: |
        200 when every readiness check the process registered passes,
        503 otherwise. Every check is listed with its state, so a
        process that registered no check says so with an empty map
        rather than claiming a dependency is healthy.
      security: []
      x-audit: none
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one readiness check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        default:
          $ref: "#/components/responses/Problem"
  /metrics:
    get:
      operationId: getMetrics
      tags: [health]
      summary: Prometheus metrics
      description: |
        Prometheus text exposition, on the admin port only (loopback or
        the private network, never routed by Caddy). Served by the
        Prometheus handler, not by a generated handler
        (`api/oapi-codegen.yaml` excludes this operation).
      security: []
      x-audit: none
      responses:
        "200":
          description: The metrics.
          content:
            text/plain:
              schema:
                type: string

  # WP-1: the authority policy and the audit log. Every operation below
  # names the console roles allowed in `x-roles`; until WP-2 lands the
  # role check is a placeholder that refuses every request without a
  # session (401 unauthenticated).
  /v1/policy:
    get:
      operationId: getPolicy
      tags: [policy]
      summary: The active policy
      description: The one active policy version and its thresholds.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The active policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPolicy
      tags: [policy]
      summary: Create a new policy version
      description: |
        Validates every threshold (finite and positive, E-15; a refusal
        names each field) and stores it as the next version, inactive.
        Activation is a separate, audited step.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: policy_created, entity_type: authority_policy, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyInput"
      responses:
        "201":
          description: The new version, inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Problem"
  /v1/policy/{version}/activate:
    post:
      operationId: activatePolicy
      tags: [policy]
      summary: Activate a policy version
      description: |
        Makes `version` the one active policy and publishes it to the
        processes that follow it. Only a version newer than the active
        one can be activated (followers apply only a higher version); a
        rollback is a new version with the old values (409 otherwise).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: policy_activated, entity_type: authority_policy, purpose: none}
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The policy now active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Problem"
  /v1/audit/events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Audit events, newest first
      description: |
        Every filter is optional; pages are cut by `before_id` (the
        `next_before_id` of the previous page). Reading the log is itself
        recorded as an `audit_events_viewed` event.
      security:
        - sessionCookie: []
      x-roles: [admin, auditor]
      x-audit: {event_type: audit_events_viewed, entity_type: events, purpose: optional}
      parameters:
        - {name: entity_type, in: query, schema: {type: string}}
        - {name: entity_id, in: query, schema: {type: string}}
        - {name: actor_id, in: query, schema: {type: string}}
        - {name: event_type, in: query, schema: {type: string}}
        - {name: from, in: query, description: Inclusive lower bound of ts., schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive upper bound of ts., schema: {type: string, format: date-time}}
        - {name: before_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: purpose, in: query, description: Why the log is read; recorded on the view event., schema: {type: string}}
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        default:
          $ref: "#/components/responses/Problem"

  # WP-2: console sign-in (password, then TOTP) and sessions. A session
  # is table A's session JWT (M20), presented as a bearer by the web BFF
  # from the uspace_session cookie (docs/runbooks/session-contract.md).
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: First sign-in step (password)
      description: |
        Checks the password and returns a short, single-use MFA
        challenge. An unknown user, a disabled user and a wrong password
        get the same answer after the same argon2id work (no user
        enumeration). An account without confirmed TOTP gets its
        enrolment secret here, after the password. Rate-limited per
        client address and per username (429 with `Retry-After`).
        Every attempt is an events row (`login_password_accepted` or
        `login_refused`).
      security: []
      x-audit: {event_type: login_password_accepted, entity_type: user, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The MFA challenge.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/mfa:
    post:
      operationId: verifyMFA
      tags: [auth]
      summary: Second sign-in step (TOTP or a recovery code)
      description: |
        Exchanges the challenge and a TOTP code (or one recovery code)
        for a session. A code is accepted once; a challenge allows a
        bounded number of attempts and is used once. The first success
        after enrolment confirms it and returns the recovery codes,
        once. Every failure is an `mfa_refused` event; the session is a
        `session_started` event.
      security: []
      x-audit: {event_type: session_started, entity_type: session, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFARequest"
      responses:
        "200":
          description: The session.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIssued"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: The session of the caller
      security:
        - sessionCookie: []
      x-session: any
      x-audit: none
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the session of the caller
      security:
        - sessionCookie: []
      x-session: any
      x-audit: {event_type: logout, entity_type: session, purpose: none}
      responses:
        "204":
          description: The session is revoked.
        default:
          $ref: "#/components/responses/Problem"
  /v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Console accounts
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: Every account, by username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      tags: [users]
      summary: Create an account
      description: |
        The account signs in with the password given here and enrols
        TOTP at its first sign-in.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: user_created, entity_type: user, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    get:
      operationId: getUser
      tags: [users]
      summary: One account
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}/roles:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    put:
      operationId: setUserRoles
      tags: [users]
      summary: Replace the roles of an account
      description: Revokes the sessions of the account, so the new roles apply at the next sign-in. The last active admin cannot lose the role (409).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: user_roles_changed, entity_type: user, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolesInput"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}/disable:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    post:
      operationId: disableUser
      tags: [users]
      summary: Disable an account
      description: Revokes its sessions; it can no longer sign in. The last active admin cannot be disabled (409).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: user_disabled, entity_type: user, purpose: none}
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}/enable:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    post:
      operationId: enableUser
      tags: [users]
      summary: Enable a disabled account
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: user_enabled, entity_type: user, purpose: none}
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}/mfa/reset:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    post:
      operationId: resetUserMFA
      tags: [users]
      summary: Reset the TOTP of an account
      description: Deletes the TOTP secret and the recovery codes and revokes the sessions; the account enrols again at its next sign-in.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: user_mfa_reset, entity_type: user, purpose: none}
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}/sessions/revoke:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    post:
      operationId: revokeUserSessions
      tags: [users]
      summary: Revoke every session of an account
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: session_revoked, entity_type: session, purpose: none}
      responses:
        "200":
          description: How many sessions were revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revoked"
        default:
          $ref: "#/components/responses/Problem"

  # WP-2: the ecosystem token service. /oauth/token and /.well-known/*
  # are public (the client authenticates in the body); /v1/oauth/* is
  # for admins. Every issuance and every refusal is an events row
  # (token_issued, token_refused; 06 §3).
  /oauth/token:
    post:
      operationId: requestToken
      tags: [tokens]
      summary: Client credentials grant
      description: |
        RFC 6749 §4.4 client credentials. The client authenticates with
        `client_secret_post` (`client_id`, `client_secret`) or
        `private_key_jwt` (RFC 7523: `client_assertion_type` =
        `urn:ietf:params:oauth:client-assertion-type:jwt-bearer`,
        `client_assertion` an RS256 JWT with `iss` = `sub` = the client
        id, `aud` = this issuer or its token endpoint, `exp` at most
        5 min ahead and a `jti` used once). Parameters in the query
        string are refused. `scope` names catalogue scopes (WP-2 table
        B), a subset of the client's. `audience`, or one RFC 8707
        `resource`, names the target: a host or the target's base URL,
        reduced to its host, which becomes `aud` (M18). For national
        scopes the host must be on the client's audience list; for
        `utm.*` and `rid.*` any host is accepted. One audience per
        token. Errors carry RFC 6749 `error` and `error_description`
        beside the problem members. Issuance is rate-limited per
        client (429 with `Retry-After`). Every refusal is a
        `token_refused` event.
      security: []
      x-audit: {event_type: token_issued, entity_type: oauth_client, purpose: none}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: An ecosystem machine token (table A).
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
        "429":
          description: The client's issuance budget is spent.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/OAuthProblem"
        default:
          $ref: "#/components/responses/Problem"
  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      tags: [tokens]
      summary: The issuer's public keys
      description: |
        Every RS256 key a verifier may meet (`use: sig`, distinguished by
        `kid`): the active token-signing key, retired token-signing keys
        until their retirement plus the JWKS cache TTL (24 h), and this
        system's publication-signing key of the detached
        `X-JWS-Signature` (M26). Cacheable for 300 s.
      security: []
      x-audit: none
      responses:
        "200":
          description: The JWKS.
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        default:
          $ref: "#/components/responses/Problem"
  /.well-known/openid-configuration:
    get:
      operationId: getIssuerMetadata
      tags: [tokens]
      summary: Issuer metadata
      description: |
        The issuer, its JWKS URL and token endpoint, the grant type and
        the client authentication methods. This is an OAuth2 issuer, not
        an OpenID provider: there is no authorisation endpoint.
      security: []
      x-audit: none
      responses:
        "200":
          description: The metadata.
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuerMetadata"
        default:
          $ref: "#/components/responses/Problem"
  /v1/oauth/clients:
    get:
      operationId: listOAuthClients
      tags: [oauth-admin]
      summary: Registered clients
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: Every client, by client id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createOAuthClient
      tags: [oauth-admin]
      summary: Register a client
      description: |
        One client per calling system (M24). Scopes must be grantable
        to this client (in the catalogue, not reserved, not of a USSP's
        issuer, `dp.observe` for `lab-01` only); audiences are hosts.
        For `client_secret_post` the secret is generated here and
        returned once; only its argon2id hash is kept. For
        `private_key_jwt` the client's public JWKS is given (RSA keys of
        at least 2048 bits, no private members).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: oauth_client_created, entity_type: oauth_client, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClientInput"
      responses:
        "201":
          description: The client, and its secret once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientCreated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/oauth/clients/{client_id}:
    parameters:
      - {name: client_id, in: path, required: true, schema: {type: string, maxLength: 64}}
    get:
      operationId: getOAuthClient
      tags: [oauth-admin]
      summary: One client
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOAuthClient
      tags: [oauth-admin]
      summary: Change a client's status, scopes, audiences or note
      description: |
        A suspended or revoked client gets no new token; tokens already
        issued expire within their TTL (at most 1 h).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: oauth_client_updated, entity_type: oauth_client, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClientPatch"
      responses:
        "200":
          description: The client as changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
        default:
          $ref: "#/components/responses/Problem"
  /v1/oauth/keys:
    get:
      operationId: listSigningKeys
      tags: [oauth-admin]
      summary: Signing keys and their state
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: Every registered key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKeyList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/oauth/keys/rotate:
    post:
      operationId: rotateSigningKey
      tags: [oauth-admin]
      summary: Activate the next token-signing key
      description: |
        The next key is the first key of `SIGNING_KEY_FILES` never
        activated. With the two-person rule (`KEY_ROTATION_TWO_PERSON`,
        default on) the first admin's call records the request (202)
        and a second admin's call within `KEY_ROTATION_CONFIRM_S`
        (600 s) activates it (200); the same admin twice is refused
        (409). The previous key is retired and stays in the JWKS for
        `KEY_RETIRE_GRACE_S` (24 h).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: signing_key_activated, entity_type: signing_key, purpose: none}
      responses:
        "200":
          description: The next key is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyRotation"
        "202":
          description: Requested; a second admin must confirm.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyRotation"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: uspace_session
      description: |
        Console session (decision M20): a JWT with `scope = "session"`,
        `roles[]`, `realm` (`console` or `police`), `jti`, `aud` = this
        system's host, set by the web BFF. State-changing requests also
        carry `X-CSRF-Token` matching the `uspace_csrf` cookie (M21).
    ecosystemToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Ecosystem machine token issued by a trusted issuer (RS256,
        `aud` = this system's host, scope from the catalogue in
        `docs/WORKPACKAGES/WP-2.md`), verified by uspace-core `auth`.
        Table B, the whole catalogue: `cis.read`, `cis.publish:zones`,
        `cis.publish:uspace`, `cis.publish:ussp_list`,
        `cis.publish:restrictions`, `cis.publish:ats_data` (reserved,
        never issued), `registry.validate`, `ussp.records`,
        `occurrences.write`, `certificates.status`, `police.query`,
        `ansp.traffic`, `ansp.coordination`, `ansp.requests`,
        `dp.observe` (lab-01 only), `utm.strategic_coordination`,
        `utm.constraint_processing`, `utm.constraint_management`,
        `utm.conformance_monitoring_sa`, `utm.availability_arbitration`,
        `rid.service_provider`, `rid.display_provider`, and at a USSP's
        issuer only `ussp.intents`, `ussp.telemetry`, `ussp.traffic`,
        `ussp.geo`.
    receiverKey:
      type: http
      scheme: bearer
      description: |
        Per-receiver bearer key of a Remote ID receiver, together with
        an HMAC-SHA256 of the exact body bytes under a separate secret
        (WP-7). Not a JWT and not a scope.

  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: The budget of this client address or account is spent.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OAuthError:
      description: A refused token request (RFC 6749 §5.2 inside a problem).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/OAuthProblem"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          description: Check name to its state; an error names the cause.
          additionalProperties:
            $ref: "#/components/schemas/Check"
    Check:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
    FieldProblem:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          description: JSON path or parameter name, as core.FieldError writes it.
        reason:
          type: string
          minLength: 1
    Problem:
      type: object
      description: |
        RFC 9457 problem details with the field-error extension of
        decision M28; the shape of uspace-lab `schemas/common/problem/v1`.
        `errors` is capped at 100 entries; `truncated` is true when it
        was cut.
      required: [type, title, status, errors]
      properties:
        type:
          type: string
          pattern: "^https://schemas\\.uspace\\.ge/problems/[a-z_]+$"
          description: "`https://schemas.uspace.ge/problems/<slug>`, slug = the counter or refusal name."
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/FieldProblem"
        truncated:
          type: boolean
    Severity:
      type: string
      enum: [info, warning, critical]
    PolicyInput:
      type: object
      description: |
        The thresholds of one policy version. Units are in the names;
        every number is finite and positive (E-15). The defaults named
        below are those of version 1, the predecessor's values.
      required:
        - height_limit_agl_m
        - pressure_uncertainty_m
        - zone_conditional_severity
        - mismatch_severity
        - identification_severity
        - spoof_distance_m
        - identity_ttl_s
        - max_gap_s
        - identify_within_s
        - broadcast_tolerance_s
        - max_latency_s
        - live_max_age_s
        - clear_after_s
        - stale_after_s
        - dp_view_diagonal_km
        - dp_poll_hz
        - cis_stale_bound_s
        - height_limit_in_uspace
      properties:
        height_limit_agl_m: {type: number, format: double, description: "Height limit over the ground (default 120)."}
        pressure_uncertainty_m: {type: number, format: double, description: "Pressure-altitude margin (default 250)."}
        zone_conditional_severity: {$ref: "#/components/schemas/Severity"}
        mismatch_severity: {$ref: "#/components/schemas/Severity"}
        identification_severity: {$ref: "#/components/schemas/Severity"}
        spoof_distance_m: {type: number, format: double, description: "Default 300."}
        identity_ttl_s: {type: number, format: double, description: "Default 15."}
        max_gap_s: {type: number, format: double, description: "Default 3."}
        identify_within_s: {type: number, format: double, description: "Default 4."}
        broadcast_tolerance_s: {type: number, format: double, description: "Default 1."}
        max_latency_s: {type: number, format: double, description: "Default 5."}
        live_max_age_s: {type: number, format: double, description: "Default 10."}
        clear_after_s: {type: number, format: double, description: "Default 3."}
        stale_after_s: {type: number, format: double, description: "Default 15."}
        dp_view_diagonal_km: {type: number, format: double, description: "Default 7."}
        dp_poll_hz: {type: number, format: double, description: "Default 1."}
        cis_stale_bound_s: {type: number, format: double, description: "Default 300."}
        height_limit_in_uspace:
          type: string
          enum: [evaluate, skip_when_authorised]
        note:
          type: string
          maxLength: 1000
    Policy:
      allOf:
        - $ref: "#/components/schemas/PolicyInput"
        - type: object
          required: [version, active, created_at, created_by, note]
          properties:
            version:
              type: integer
              format: int64
              description: The policy_version every violation carries.
            active:
              type: boolean
            created_at:
              type: string
              format: date-time
            created_by:
              type: string
            activated_at:
              type: string
              format: date-time
            activated_by:
              type: string
    AuditEvent:
      type: object
      required: [id, ts, actor_type, actor_id, entity_type, event_type, payload, prev_hash, hash]
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        actor_type:
          type: string
          enum: [user, client, receiver, system]
        actor_id:
          type: string
        realm:
          type: string
        purpose:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        event_type:
          type: string
        payload:
          type: object
          additionalProperties: true
        prev_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    AuditEventPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_before_id:
          type: integer
          format: int64
          description: Pass as before_id for the next page; absent on the last page.
    OAuthProblem:
      description: |
        A problem (M28) that also carries the RFC 6749 §5.2 members, so
        an OAuth2 client library reads `error` and a uspace client reads
        the problem. `error` is `invalid_request`, `invalid_client`,
        `invalid_scope`, `invalid_target` (RFC 8707),
        `unauthorized_client`, `unsupported_grant_type` or
        `temporarily_unavailable` (rate limit).
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [error]
          properties:
            error:
              type: string
              enum: [invalid_request, invalid_client, invalid_scope, invalid_target, unauthorized_client, unsupported_grant_type, temporarily_unavailable]
            error_description:
              type: string
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: {type: string}
        client_id: {type: string}
        client_secret: {type: string}
        client_assertion_type: {type: string}
        client_assertion: {type: string}
        scope: {type: string, description: "Space-separated catalogue scopes (WP-2 table B)."}
        audience: {type: string, description: "The target's host or base URL; its host becomes aud (M18)."}
        resource:
          type: array
          description: RFC 8707 resource indicator (one), an alternative to audience.
          items: {type: string}
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: {type: string}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, description: Seconds until exp (at most 3600).}
        scope: {type: string}
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
    IssuerMetadata:
      type: object
      required: [issuer, jwks_uri, token_endpoint, grant_types_supported, token_endpoint_auth_methods_supported, token_endpoint_auth_signing_alg_values_supported, scopes_supported]
      properties:
        issuer: {type: string}
        jwks_uri: {type: string}
        token_endpoint: {type: string}
        grant_types_supported:
          type: array
          items: {type: string}
        token_endpoint_auth_methods_supported:
          type: array
          items: {type: string}
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          items: {type: string}
        scopes_supported:
          type: array
          items: {type: string}
    OAuthClientStatus:
      type: string
      enum: [active, suspended, revoked]
    OAuthAuthMethod:
      type: string
      enum: [client_secret_post, private_key_jwt]
    OAuthClientInput:
      type: object
      required: [client_id, scopes, auth_method]
      properties:
        client_id:
          type: string
          maxLength: 64
          description: "authority-01, cisp-01, ansp-01, ussp-<code>-01 or lab-01 (M24)."
        scopes:
          type: array
          maxItems: 32
          items: {type: string}
        audiences:
          type: array
          maxItems: 32
          description: Hosts this client may name for national scopes.
          items: {type: string}
        auth_method:
          $ref: "#/components/schemas/OAuthAuthMethod"
        jwks:
          $ref: "#/components/schemas/JWKS"
        mtls_subject: {type: string, maxLength: 512}
        certificate_id: {type: string, maxLength: 64}
        note: {type: string, maxLength: 1000}
    OAuthClientPatch:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/OAuthClientStatus"
        scopes:
          type: array
          maxItems: 32
          items: {type: string}
        audiences:
          type: array
          maxItems: 32
          items: {type: string}
        note: {type: string, maxLength: 1000}
    OAuthClient:
      type: object
      required: [client_id, system, scopes, audiences, auth_method, status, note, created_at, created_by, updated_at, updated_by]
      properties:
        client_id: {type: string}
        system: {type: string, enum: [authority, cisp, ansp, ussp, lab]}
        scopes:
          type: array
          items: {type: string}
        audiences:
          type: array
          items: {type: string}
        auth_method:
          $ref: "#/components/schemas/OAuthAuthMethod"
        jwks:
          $ref: "#/components/schemas/JWKS"
        mtls_subject: {type: string}
        certificate_id: {type: string}
        status:
          $ref: "#/components/schemas/OAuthClientStatus"
        note: {type: string}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    OAuthClientList:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/OAuthClient"
    OAuthClientCreated:
      type: object
      required: [client]
      properties:
        client:
          $ref: "#/components/schemas/OAuthClient"
        client_secret:
          type: string
          description: The client_secret_post secret; shown here once and never again.
    SigningKey:
      type: object
      required: [kid, purpose, state, registered_at]
      properties:
        kid: {type: string}
        purpose: {type: string, enum: [token, publication]}
        state:
          type: string
          enum: [candidate, requested, active, retiring, retired]
          description: "retiring: retired but still in the JWKS; retired: no longer published."
        registered_at: {type: string, format: date-time}
        active_from: {type: string, format: date-time}
        retired_at: {type: string, format: date-time}
        requested_by: {type: string}
        requested_at: {type: string, format: date-time}
    SigningKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SigningKey"
    KeyRotation:
      type: object
      required: [state, kid, active_kid]
      properties:
        state: {type: string, enum: [requested, activated]}
        kid: {type: string, description: The key requested or activated.}
        active_kid: {type: string, description: The key that signs after this call.}
        previous_kid: {type: string}
        requested_by: {type: string}
        confirm_before: {type: string, format: date-time}
    Role:
      type: string
      enum: [viewer, inspector, registrar, incident_officer, admin, auditor]
    Realm:
      type: string
      enum: [console, police]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, maxLength: 256}
        password: {type: string, maxLength: 1024}
    LoginChallenge:
      type: object
      required: [mfa_token, expires_at]
      properties:
        mfa_token: {type: string, description: Single use; present it to /v1/auth/mfa.}
        expires_at: {type: string, format: date-time}
        enrolment:
          $ref: "#/components/schemas/MFAEnrolment"
    MFAEnrolment:
      type: object
      description: Present only while the account has no confirmed TOTP.
      required: [secret, otpauth_uri]
      properties:
        secret: {type: string, description: Base32 TOTP secret (RFC 6238, SHA-1, 6 digits, 30 s).}
        otpauth_uri: {type: string}
    MFARequest:
      type: object
      required: [mfa_token]
      properties:
        mfa_token: {type: string, maxLength: 256}
        code: {type: string, maxLength: 16, description: The current TOTP code.}
        recovery_code: {type: string, maxLength: 64, description: One unused recovery code, instead of a TOTP code.}
    SessionInfo:
      type: object
      required: [sub, roles, realm, jti, expires_at, idle_expires_at]
      properties:
        sub: {type: string, description: The account id.}
        roles:
          type: array
          items: {type: string}
        realm:
          $ref: "#/components/schemas/Realm"
        jti: {type: string, description: The session id.}
        expires_at: {type: string, format: date-time}
        idle_expires_at: {type: string, format: date-time}
    SessionIssued:
      type: object
      required: [token, token_type, expires_at, idle_timeout_s, session]
      properties:
        token: {type: string, description: "The session JWT (table A): the BFF puts it in the uspace_session cookie."}
        token_type: {type: string, enum: [Bearer]}
        expires_at: {type: string, format: date-time}
        idle_timeout_s: {type: integer}
        session:
          $ref: "#/components/schemas/SessionInfo"
        recovery_codes:
          type: array
          description: Shown once, at the sign-in that confirms enrolment.
          items: {type: string}
    UserInput:
      type: object
      required: [username, password, roles, realm]
      properties:
        username: {type: string, maxLength: 64}
        password: {type: string, maxLength: 1024}
        display_name: {type: string, maxLength: 200}
        roles:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/Role"
        realm:
          $ref: "#/components/schemas/Realm"
    RolesInput:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/Role"
    User:
      type: object
      required: [id, username, display_name, roles, realm, status, mfa_enrolled, created_at, created_by, updated_at, updated_by]
      properties:
        id: {type: string}
        username: {type: string}
        display_name: {type: string}
        roles:
          type: array
          items: {type: string}
        realm:
          $ref: "#/components/schemas/Realm"
        status: {type: string, enum: [active, disabled]}
        mfa_enrolled: {type: boolean}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    Revoked:
      type: object
      required: [revoked]
      properties:
        revoked: {type: integer}
