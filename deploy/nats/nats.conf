# NATS for uspace-authority on staging and in production
# (deploy/compose.yaml). One user per process (api, rid-ingest,
# dp-poller, manned-ingest, detect, tsdb-writer, picture-ws) and one for
# the backup's KV export; the users and their passwords are in
# users.conf, generated on the host by deploy/gen-secrets.sh beside each
# process's NATS_URL (so not in git). The store bounds come from the
# compose environment.
#
# Every authority stream is bounded by age (MaxBytes -1), so nothing is
# reserved and max_file_store is the one byte bound: when the store is
# full JetStream refuses new messages until the age limits free space,
# and the processes count the refusals.
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_file_store: $NATS_MAX_FILE_STORE
  max_memory_store: $NATS_MAX_MEMORY_STORE
}

include ./users.conf
