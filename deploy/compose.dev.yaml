# Development stack: one timescaledb-ha container holding both databases
# (`authority` with PostGIS for the relational tree, `authority_ts` with
# TimescaleDB for the telemetry tree), as deploy/compose.yaml holds them
# on staging, so local and staging never differ in layout (M37, WP-24);
# and NATS with JetStream on a file store. `make up` waits until every
# service is healthy; `make down` removes the volumes. The database is
# published on two host ports, the relational and the telemetry URL's
# (the Makefile's DEV_PG_URL and DEV_TS_URL), so the URLs and every
# test that reads them stay as they were. Host ports are high and
# overridable (AUTHORITY_DEV_*_PORT) so the stack runs beside the
# sibling systems' stacks.
# The credentials are throwaway values for a local container only; real
# ones are generated on the host (deploy/gen-secrets.sh).
name: uspace-authority-dev

services:
  postgres:
    image: timescale/timescaledb-ha:pg16@sha256:e9f34d8dd27621ec3933386eb07b70021d15b8116247362e0537bbff94ef0769
    environment:
      POSTGRES_PASSWORD: authority
      POSTGRES_DB: authority
    ports:
      - "127.0.0.1:${AUTHORITY_DEV_PG_PORT:-56432}:5432"
      - "127.0.0.1:${AUTHORITY_DEV_TS_PORT:-56433}:5432"
    volumes:
      - ./initdb/10-authority.sql:/docker-entrypoint-initdb.d/10-authority.sql:ro
      - ./initdb/dev/20-authority-role.sql:/docker-entrypoint-initdb.d/20-authority-role.sql:ro
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d authority && psql -U postgres -d authority_ts -tAc 'SELECT 1' | grep -q 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  nats:
    image: nats:2-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:${AUTHORITY_DEV_NATS_PORT:-56422}:4222", "127.0.0.1:${AUTHORITY_DEV_NATS_MON_PORT:-56822}:8222"]
    volumes: [nats:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  nats:
