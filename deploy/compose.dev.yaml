# Development stack: PostGIS (relational tree), TimescaleDB (telemetry
# tree) and NATS with JetStream on a file store. `make up` waits until
# every service is healthy; `make down` removes the volumes. Host ports
# are high and overridable (AUTHORITY_DEV_*_PORT) so the stack runs
# beside the sibling systems' stacks.
# The credentials are throwaway values for a local container only; real
# ones live in the private deployment repository (spec 06 §4).
name: uspace-authority-dev

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: authority
      POSTGRES_PASSWORD: authority
      POSTGRES_DB: authority
    ports: ["127.0.0.1:${AUTHORITY_DEV_PG_PORT:-56432}:5432"]
    volumes: [postgis:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authority -d authority"]
      interval: 2s
      timeout: 3s
      retries: 30

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_PASSWORD: authority
      POSTGRES_DB: authority_ts
    ports: ["127.0.0.1:${AUTHORITY_DEV_TS_PORT:-56433}:5432"]
    volumes: [timescaledb:/home/postgres/pgdata]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authority_ts"]
      interval: 2s
      timeout: 3s
      retries: 60

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:${AUTHORITY_DEV_NATS_PORT:-56422}:4222", "127.0.0.1:${AUTHORITY_DEV_NATS_MON_PORT:-56822}:8222"]
    volumes: [nats:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgis:
  timescaledb:
  nats:
